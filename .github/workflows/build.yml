name: Build and Lint

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # the Node.js versions to build on
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint the project
        run: npm run lint

      - name: Build the project
        run: npm run build
        env:
          CI: true

  homebridge-compat:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # verify the plugin compiles against both supported Homebridge majors
        homebridge-version: ['1', '2']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Install Homebridge v${{ matrix.homebridge-version }}
        run: npm install --no-save homebridge@${{ matrix.homebridge-version }}

      - name: Build against Homebridge v${{ matrix.homebridge-version }}
        run: npm run build
